{% extends "base.html" %}

{% block titulo %}Excluir Pagamento{% endblock %}

{% block conteudo %}
<h2>Excluir Pagamento</h2>
<p>Confirma excluir o pagamento {{ object.pk }}?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirmar exclusao</button>
</form>
<p><a href="{% url 'pagamentos:pagamento_list' %}">Cancelar</a></p>
{% endblock %}
