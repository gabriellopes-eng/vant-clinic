{% extends "base.html" %}

{% block titulo %}Delete Payment{% endblock %}

{% block conteudo %}
<section class="panel">
    <div class="title-group">
        <h2>Delete payment</h2>
        <p>This action removes payment record <strong>#{{ object.pk }}</strong>.</p>
    </div>
    <form method="post" class="form-layout" data-confirm="Are you sure you want to delete this payment?">
        {% csrf_token %}
        <div class="button-row">
            <button class="btn btn-danger" type="submit">Confirm deletion</button>
            <a class="btn btn-secondary" href="{% url 'pagamentos:pagamento_list' %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
