{% extends "base.html" %}

{% block titulo %}Excluir Servico{% endblock %}

{% block conteudo %}
<section class="panel">
    <div class="title-group">
        <h2>Excluir servico</h2>
        <p>Esta acao remove o servico <strong>{{ object.nome }}</strong> do catalogo.</p>
    </div>
    <form method="post" class="form-layout" data-confirm="Tem certeza que deseja excluir este servico?">
        {% csrf_token %}
        <div class="button-row">
            <button class="btn btn-danger" type="submit">Confirmar exclusao</button>
            <a class="btn btn-secondary" href="{% url 'servicos:servico_list' %}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
