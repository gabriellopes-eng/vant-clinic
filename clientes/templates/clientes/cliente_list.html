{% extends "base.html" %}

{% block titulo %}Clientes{% endblock %}

{% block conteudo %}
<h2>Clientes</h2>
<p><a href="{% url 'clientes:cliente_create' %}">Novo cliente</a></p>
<ul>
    {% for cliente in clientes %}
        <li>
            {{ cliente.nome }} - {{ cliente.telefone }}
            <a href="{% url 'clientes:cliente_update' cliente.pk %}">Editar</a>
            <a href="{% url 'clientes:cliente_delete' cliente.pk %}">Excluir</a>
        </li>
    {% empty %}
        <li>Nenhum cliente cadastrado.</li>
    {% endfor %}
</ul>
{% endblock %}
