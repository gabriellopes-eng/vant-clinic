{% extends "base.html" %}

{% block titulo %}Excluir Cliente{% endblock %}

{% block conteudo %}
<section class="panel">
    <div class="title-group">
        <h2>Excluir cliente</h2>
        <p>Esta acao remove o cadastro de <strong>{{ object.nome }}</strong>.</p>
    </div>
    <form method="post" class="form-layout" data-confirm="Tem certeza que deseja excluir este cliente?">
        {% csrf_token %}
        <div class="button-row">
            <button class="btn btn-danger" type="submit">Confirmar exclusao</button>
            <a class="btn btn-secondary" href="{% url 'clientes:cliente_list' %}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
